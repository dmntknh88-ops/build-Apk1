name: Build Android Native APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Job ID
        required: true
        type: string
      userId:
        description: Telegram user ID
        required: true
        type: string
      payload:
        description: JSON payload
        required: true
        type: string
  repository_dispatch:
    types:
      - web2apk-build-android
      - web2apk-build-native
      - web2apk-build

jobs:
  build-native:
    name: Native Android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse payload
        id: meta
        env:
          PAYLOAD_INPUT: ${{ inputs.payload }}
          JOB_ID_INPUT: ${{ inputs.jobId }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -e
          python3 << 'PY'
          import json, os
          event_name = os.environ.get("EVENT_NAME", "")
          event_path = os.environ.get("EVENT_PATH", "")
          p = {}
          if event_name == "repository_dispatch" and event_path and os.path.isfile(event_path):
              ev = json.load(open(event_path, encoding="utf-8"))
              p = ev.get("client_payload") or {}
          else:
              raw = os.environ.get("PAYLOAD_INPUT") or ""
              if raw:
                  try:
                      p = json.loads(raw)
                  except Exception as e:
                      print("payload json error", e)
                      p = {}

          def g(*keys):
              for k in keys:
                  v = p.get(k) if isinstance(p, dict) else None
                  if v is not None and str(v).strip() != "":
                      return str(v).strip()
              return ""

          asset = g("assetId", "asset_id")
          tag = g("zipReleaseTag", "releaseTag", "release_tag")
          repo = g("repo") or os.environ.get("GITHUB_REPOSITORY", "")
          token = g("downloadToken", "token", "ghToken")
          app = g("appName", "app_name") or "MyApp"
          job_id = g("jobId", "job_id") or os.environ.get("JOB_ID_INPUT", "") or "job"
          build_type = (g("buildType", "build_type") or "release").lower()
          inbox = g("inboxPath", "inbox_path")
          branch = g("branch") or "main"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"asset_id={asset}\n")
              f.write(f"release_tag={tag}\n")
              f.write(f"repo={repo}\n")
              f.write(f"app_name={app}\n")
              f.write(f"job_id={job_id}\n")
              f.write(f"build_type={build_type}\n")
              f.write(f"inbox_path={inbox}\n")
              f.write(f"branch={branch}\n")
          if token:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write(f"DL_TOKEN={token}\n")
          print("asset_id=", asset, "tag=", tag, "job=", job_id, "token=", "yes" if token else "no")
          PY

      - name: Download ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_ID: ${{ steps.meta.outputs.asset_id }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          REPO: ${{ steps.meta.outputs.repo }}
          INBOX: ${{ steps.meta.outputs.inbox_path }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          JOB_ID: ${{ steps.meta.outputs.job_id }}
        run: |
          set -eu
          TOKEN="${DL_TOKEN:-$GH_TOKEN}"
          REPO="${REPO:-$GITHUB_REPOSITORY}"
          BRANCH="${BRANCH:-main}"
          INBOX="${INBOX:-.web2apk-inbox/${JOB_ID}/project.zip}"
          echo "[dl] repo=$REPO asset=$ASSET_ID tag=$RELEASE_TAG"
          download_ok=0
          rm -f project.zip

          if [ -n "${ASSET_ID}" ]; then
            code=$(curl -sS -L --retry 8 --retry-delay 2 -o project.zip -w "%{http_code}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/releases/assets/${ASSET_ID}" || echo 000)
            sz=$(stat -c%s project.zip 2>/dev/null || echo 0)
            echo "[dl] asset HTTP=$code size=$sz"
            if [ "$sz" -gt 5000 ]; then download_ok=1; else rm -f project.zip; fi
          fi

          if [ "$download_ok" -eq 0 ] && [ -n "${RELEASE_TAG}" ]; then
            REL=$(curl -sS -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/tags/${RELEASE_TAG}" || true)
            echo "$REL" > /tmp/rel.json
            AID2=$(python3 -c 'import json;d=json.load(open("/tmp/rel.json"));print(next((str(a["id"]) for a in d.get("assets",[]) if a.get("name")=="project.zip"),""))' 2>/dev/null || true)
            if [ -n "$AID2" ]; then
              curl -sS -L --retry 5 -o project.zip \
                -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/octet-stream" \
                "https://api.github.com/repos/${REPO}/releases/assets/${AID2}" || true
              sz=$(stat -c%s project.zip 2>/dev/null || echo 0)
              if [ "$sz" -gt 5000 ]; then download_ok=1; fi
            fi
          fi

          if [ "$download_ok" -eq 0 ] && [ -n "${INBOX}" ]; then
            curl -sS -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/contents/${INBOX}?ref=${BRANCH}" -o /tmp/meta.json || true
            DL_URL=$(python3 -c 'import json;d=json.load(open("/tmp/meta.json"));print(d.get("download_url") or "")' 2>/dev/null || true)
            if [ -n "$DL_URL" ]; then
              curl -sS -L --retry 5 -o project.zip -H "Authorization: Bearer ${TOKEN}" "$DL_URL" || true
              sz=$(stat -c%s project.zip 2>/dev/null || echo 0)
              if [ "$sz" -gt 5000 ]; then download_ok=1; fi
            fi
          fi

          if [ "$download_ok" -eq 0 ]; then
            echo "FATAL ZIP download failed"
            exit 1
          fi

          echo "ZIP OK size=$(stat -c%s project.zip)"
          rm -rf project_src
          mkdir -p project_src
          python3 << 'UNZIPPY'
          import zipfile, os, sys, struct
          dest = "project_src"
          ok = skip = 0
          failed_paths = []
          z = zipfile.ZipFile("project.zip", "r")
          for info in z.infolist():
              name = info.filename
              if not name or name.endswith("/"):
                  try:
                      os.makedirs(os.path.join(dest, name), exist_ok=True)
                  except Exception:
                      pass
                  continue
              try:
                  z.extract(info, dest)
                  ok += 1
              except Exception as e:
                  skip += 1
                  failed_paths.append(name)
                  print("skip corrupt:", name, "->", e)
                  # buat folder parent
                  parent = os.path.join(dest, os.path.dirname(name))
                  os.makedirs(parent, exist_ok=True)
          z.close()
          # Placeholder minimal valid MP4 untuk raw resources yang korup
          # ftyp + free + mdat kosong (cukup agar aapt tidak error)
          MIN_MP4 = bytes.fromhex(
              "0000001c6674797069736f6d0000020069736f6d69736f326d703431"
              "0000000866726565000000086d646174"
          )
          for name in failed_paths:
              out = os.path.join(dest, name)
              os.makedirs(os.path.dirname(out), exist_ok=True)
              if name.lower().endswith((".mp4", ".m4v", ".webm")):
                  with open(out, "wb") as f:
                      f.write(MIN_MP4)
                  print("placeholder media:", name)
              elif name.lower().endswith((".mp3", ".ogg", ".wav")):
                  # silent minimal - skip audio placeholder empty file may break; write tiny
                  with open(out, "wb") as f:
                      f.write(b"\x00" * 64)
                  print("placeholder audio:", name)
              else:
                  with open(out, "wb") as f:
                      f.write(b"")
                  print("placeholder empty:", name)
          print(f"extracted={ok} skipped={skip}")
          if ok < 3:
              print("FATAL: terlalu sedikit file")
              sys.exit(1)
          UNZIPPY

          ND=$(find project_src -mindepth 1 -maxdepth 1 -type d | wc -l)
          NF=$(find project_src -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$ND" -eq 1 ] && [ "$NF" -eq 0 ]; then
            sub=$(find project_src -mindepth 1 -maxdepth 1 -type d | head -1)
            shopt -s dotglob
            mv "$sub"/* project_src/ 2>/dev/null || true
            rmdir "$sub" 2>/dev/null || true
            shopt -u dotglob
          fi

          # Cari root Android (gradlew / settings.gradle)
          ROOT=""
          if [ -f project_src/gradlew ]; then ROOT=project_src
          elif [ -f project_src/android/gradlew ]; then ROOT=project_src/android
          else
            ROOT=$(find project_src -name gradlew -type f 2>/dev/null | head -1 | xargs -r dirname || true)
          fi
          if [ -z "$ROOT" ]; then
            if [ -f project_src/settings.gradle ] || [ -f project_src/settings.gradle.kts ]; then ROOT=project_src
            elif [ -f project_src/android/settings.gradle ]; then ROOT=project_src/android
            fi
          fi
          if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
            echo "FATAL: project Android native tidak ditemukan"
            find project_src -maxdepth 3 -type f | head -40
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          ls -la "$ROOT" | head -25

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses + packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Ensure Gradle wrapper
        run: |
          set -eu
          cd "$ROOT"
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing — generating"
            mkdir -p gradle/wrapper
            # download official wrapper jar (Gradle 8.4)
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
              || curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
              || true
            if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
              # fallback: install gradle via sdk and generate wrapper
              sudo apt-get update -qq && sudo apt-get install -y -qq gradle || true
              gradle wrapper --gradle-version 8.4 || true
            fi
          fi
          if [ -f gradlew ]; then chmod +x gradlew; fi
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            cat gradle/wrapper/gradle-wrapper.properties
          fi
          ls -la gradle/wrapper/ || true

      - name: Build APK
        env:
          BUILD_TYPE: ${{ steps.meta.outputs.build_type }}
        run: |
          set -eu
          cd "$ROOT"
          if [ -n "${ANDROID_HOME:-}" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            GRADLE="./gradlew"
            chmod +x gradlew
          else
            command -v gradle >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq gradle)
            GRADLE="gradle"
          fi
          echo "Using: $GRADLE BUILD_TYPE=$BUILD_TYPE"
          set +e
          if [ "$BUILD_TYPE" = "debug" ]; then
            $GRADLE assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log
            RC=${PIPESTATUS[0]}
          else
            $GRADLE assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log
            RC=${PIPESTATUS[0]}
            if [ "$RC" -ne 0 ]; then
              echo "Release failed, try assembleDebug..."
              $GRADLE assembleDebug --stacktrace --no-daemon 2>&1 | tee -a /tmp/gradle.log
              RC=${PIPESTATUS[0]}
            fi
          fi
          set -e
          tail -100 /tmp/gradle.log || true
          if [ "$RC" -ne 0 ]; then
            echo "GRADLE FAILED rc=$RC"
            exit 1
          fi
          APK=$(find . -path '*/outputs/apk/**/*.apk' -type f 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            APK=$(find . -name '*.apk' -type f 2>/dev/null | head -1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "FATAL: APK not found"
            find . -name '*.apk' 2>/dev/null | head
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/app-release.apk"
          ls -lh "$GITHUB_WORKSPACE/app-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.meta.outputs.job_id }}
          path: app-release.apk
          if-no-files-found: error
          retention-days: 3
