name: Build Android Native APK

# ============================================================
# NATIVE ONLY — jangan digabung dengan build-flutter.yml
# Dipakai hanya jika deteksi: gradlew / build.gradle / Kotlin
# ============================================================
on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Job ID
        required: true
        type: string
      userId:
        description: Telegram user ID
        required: true
        type: string
      payload:
        description: JSON payload
        required: true
        type: string
  repository_dispatch:
    types: [web2apk-build-android, web2apk-build-native]

jobs:
  build-native:
    name: Native Android only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse payload
        id: meta
        env:
          PAYLOAD_JSON: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload) || inputs.payload }}
          INPUT_JOB: ${{ inputs.jobId }}
          INPUT_USER: ${{ inputs.userId }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, os
          raw = os.environ.get("PAYLOAD_JSON") or "{}"
          try:
              p = json.loads(raw)
          except Exception:
              p = {}
          if isinstance(p.get("payload"), dict):
              p = {**p, **p["payload"]}
          if isinstance(p.get("payload"), str):
              try:
                  inner = json.loads(p["payload"])
                  if isinstance(inner, dict):
                      p = {**p, **inner}
              except Exception:
                  pass

          def g(*keys):
              for k in keys:
                  v = p.get(k) if isinstance(p, dict) else None
                  if v is not None and str(v).strip() != "":
                      return str(v).strip()
              return ""

          job_id = g("jobId", "job_id") or os.environ.get("INPUT_JOB") or "job"
          user_id = g("userId", "user_id") or os.environ.get("INPUT_USER") or ""
          asset = g("assetId", "asset_id")
          tag = g("zipReleaseTag", "releaseTag", "release_tag")
          repo = g("repo") or os.environ.get("GITHUB_REPOSITORY", "")
          token = g("downloadToken", "token", "ghToken")
          build_type = (g("buildType", "build_type") or "release").lower()
          if build_type not in ("release", "debug"):
              build_type = "release"
          app_name = g("appName", "app_name") or "App"
          custom_icon = g("customIcon", "iconUrl", "icon_url", "iconFileId")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"job_id={job_id}\n")
              f.write(f"inbox_path={inbox}\n")
              f.write(f"branch={branch}\n")
              f.write(f"user_id={user_id}\n")
              f.write(f"asset_id={asset}\n")
              f.write(f"release_tag={tag}\n")
              f.write(f"repo={repo}\n")
              f.write(f"build_type={build_type}\n")
              f.write(f"app_name={app_name}\n")
              f.write(f"custom_icon={custom_icon}\n")
          if token:
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write(f"DL_TOKEN={token}\n")
          print("NATIVE", job_id, build_type, "asset", bool(asset), "icon", bool(custom_icon))
          PY


      - name: Download ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_ID: ${{ steps.meta.outputs.asset_id }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          REPO: ${{ steps.meta.outputs.repo }}
          INBOX: ${{ steps.meta.outputs.inbox_path }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          JOB_ID: ${{ steps.meta.outputs.job_id }}
        run: |
          set -eu
          TOKEN="${DL_TOKEN:-$GH_TOKEN}"
          REPO="${REPO:-$GITHUB_REPOSITORY}"
          BRANCH="${BRANCH:-main}"
          INBOX="${INBOX:-.web2apk-inbox/${JOB_ID}/project.zip}"
          echo "[dl] repo=$REPO branch=$BRANCH inbox=$INBOX asset=$ASSET_ID tag=$RELEASE_TAG token=${TOKEN:+yes}"
          download_ok=0

          if [ -n "$INBOX" ] && [ -n "$TOKEN" ]; then
            META=$(curl -sS -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${REPO}/contents/${INBOX}?ref=${BRANCH}" || true)
            DL_URL=$(printf '%s' "$META" | python3 -c "import json,sys
try:
 d=json.load(sys.stdin); print(d.get('download_url') or '')
except Exception:
 print('')")
            echo "[dl] contents url=${DL_URL:0:100}"
            if [ -n "$DL_URL" ]; then
              code=$(curl -sS -L --retry 5 --retry-delay 2 -o project.zip -w "%{http_code}" -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github.raw" "$DL_URL" || echo 000)
              sz=$(stat -c%s project.zip 2>/dev/null || echo 0)
              echo "[dl] contents HTTP=$code size=$sz"
              if [ "$sz" -gt 1000 ]; then download_ok=1; else rm -f project.zip; fi
            fi
          fi

          if [ "$download_ok" -eq 0 ] && [ -n "$ASSET_ID" ]; then
            code=$(curl -sS -L --retry 5 -o project.zip -w "%{http_code}" -H "Authorization: Bearer $TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${REPO}/releases/assets/${ASSET_ID}" || echo 000)
            sz=$(stat -c%s project.zip 2>/dev/null || echo 0)
            echo "[dl] asset HTTP=$code size=$sz"
            if [ "$sz" -gt 1000 ]; then download_ok=1; else rm -f project.zip; fi
          fi

          if [ "$download_ok" -eq 0 ] && [ -n "$RELEASE_TAG" ] && command -v gh >/dev/null 2>&1; then
            GH_TOKEN="$TOKEN" gh release download "$RELEASE_TAG" -R "$REPO" -p "project.zip" -D . 2>/dev/null || true
            sz=$(stat -c%s project.zip 2>/dev/null || echo 0)
            if [ "$sz" -gt 1000 ]; then download_ok=1; fi
          fi

          if [ "$download_ok" -eq 0 ]; then
            echo "FATAL: ZIP download failed repo=$REPO inbox=$INBOX asset=$ASSET_ID tag=$RELEASE_TAG"
            exit 1
          fi

          echo "ZIP OK size=$(stat -c%s project.zip)"
          rm -rf project_src
          mkdir -p project_src
          unzip -q project.zip -d project_src
          ND=$(find project_src -mindepth 1 -maxdepth 1 -type d | wc -l)
          NF=$(find project_src -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$ND" -eq 1 ] && [ "$NF" -eq 0 ]; then
            sub=$(find project_src -mindepth 1 -maxdepth 1 -type d | head -1)
            shopt -s dotglob
            mv "$sub"/* project_src/ 2>/dev/null || true
            rmdir "$sub" 2>/dev/null || true
            shopt -u dotglob
          fi
          ls -la project_src | head -30

      - name: Assert NATIVE root (reject pure Flutter)
        id: root
        run: |
          set -euo pipefail
          PUB=$(find project_src -maxdepth 6 -type f -name pubspec.yaml 2>/dev/null | head -1 || true)
          GW=$(find project_src -maxdepth 6 -type f -name gradlew 2>/dev/null | head -1 || true)
          BG=$(find project_src -maxdepth 8 -type f \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) 2>/dev/null | head -1 || true)

          if [ -n "$PUB" ] && [ -z "$GW" ] && [ -z "$BG" ]; then
            echo "ERROR: ini project Flutter. Pakai build-flutter.yml"
            exit 1
          fi

          ROOT=""
          if [ -n "$GW" ]; then
            ROOT=$(dirname "$GW")
          elif [ -n "$BG" ]; then
            ROOT=$(dirname "$(dirname "$BG")")
          fi

          if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
            echo "ERROR: root Native tidak ketemu (gradlew / app/build.gradle)"
            find project_src -maxdepth 5 -type f \( -name 'build.gradle*' -o -name 'settings.gradle*' -o -name pubspec.yaml -o -name gradlew \) | head -40
            exit 1
          fi

          echo "NATIVE_ROOT=$ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "=== default launcher icons ==="
          find "$ROOT" -type f \( -path '*/res/mipmap*/*' -o -path '*/res/drawable*/*ic_launcher*' \) 2>/dev/null | head -30 || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages + licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-33" \
            "build-tools;34.0.0" \
            "build-tools;33.0.2" \
            >/tmp/sdk-install.txt 2>&1 || true

      - name: Ensure gradlew executable
        run: |
          set -euo pipefail
          ROOT="${{ steps.root.outputs.root }}"
          cd "$ROOT"
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "gradlew hilang"
            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 8.7
              chmod +x gradlew
            else
              exit 1
            fi
          fi

      - name: Apply app name to strings.xml
        env:
          APP_NAME: ${{ steps.meta.outputs.app_name }}
          ROOT: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail
          if [ -z "${APP_NAME}" ] || [ "${APP_NAME}" = "App" ]; then
            echo "skip app name"
            exit 0
          fi
          python3 -c '
          import os, re
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          name = os.environ.get("APP_NAME") or "App"
          found = False
          for p in root.rglob("strings.xml"):
              if "build" in p.parts:
                  continue
              try:
                  t = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              nt, n = re.subn(
                  r"(<string\s+name=\"app_name\">)[^<]*(</string>)",
                  lambda m: m.group(1) + name + m.group(2),
                  t,
                  count=1,
              )
              if n:
                  p.write_text(nt, encoding="utf-8")
                  print("updated", p)
                  found = True
                  break
          if not found:
              print("app_name not found — keep default")
          '

      - name: Launcher icon (custom URL or default mipmap)
        env:
          CUSTOM_ICON: ${{ steps.meta.outputs.custom_icon }}
          ROOT: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail
          cd "$ROOT"

          DEFAULT_ICON=$(find . -type f \( \
              -path '*/res/mipmap-xxhdpi/ic_launcher.png' -o \
              -path '*/res/mipmap-xxxhdpi/ic_launcher.png' -o \
              -path '*/res/mipmap-xhdpi/ic_launcher.png' -o \
              -path '*/res/mipmap-hdpi/ic_launcher.png' -o \
              -path '*/res/mipmap-mdpi/ic_launcher.png' -o \
              -path '*/res/drawable/ic_launcher.png' \
            \) 2>/dev/null | head -1 || true)
          echo "default_icon=${DEFAULT_ICON:-none}"

          if [ -z "${CUSTOM_ICON}" ]; then
            echo "Keep default project icons (mipmap/drawable)"
            exit 0
          fi

          mkdir -p /tmp/icon_work
          if echo "$CUSTOM_ICON" | grep -qiE '^https?://'; then
            curl -sS -L -o /tmp/icon_work/icon_in.png "$CUSTOM_ICON" || true
          fi
          if [ ! -s /tmp/icon_work/icon_in.png ]; then
            echo "Custom icon gagal diunduh — keep default"
            exit 0
          fi

          python3 -c '
          import os, sys
          from pathlib import Path
          try:
              from PIL import Image
          except ImportError:
              os.system("pip install pillow -q")
              from PIL import Image
          src = Path("/tmp/icon_work/icon_in.png")
          if not src.exists():
              sys.exit(0)
          img = Image.open(src).convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          root = Path(os.environ["ROOT"])
          res_dirs = [d for d in root.rglob("res") if d.is_dir() and "build" not in d.parts]
          if not res_dirs:
              print("no res/")
              sys.exit(0)
          res = res_dirs[0]
          for folder, px in sizes.items():
              out_dir = res / folder
              out_dir.mkdir(parents=True, exist_ok=True)
              resized = img.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(out_dir / "ic_launcher.png", "PNG")
              resized.save(out_dir / "ic_launcher_round.png", "PNG")
              print("wrote", out_dir)
          print("custom icon applied")
          '

      - name: Build APK Native
        id: build
        env:
          BUILD_TYPE: ${{ steps.meta.outputs.build_type }}
        run: |
          set -euo pipefail
          ROOT="${{ steps.root.outputs.root }}"
          cd "$ROOT"
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          TASK="assembleRelease"
          if [ "${BUILD_TYPE}" = "debug" ]; then
            TASK="assembleDebug"
          fi
          echo "[native] ./gradlew $TASK"
          ./gradlew "$TASK" --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-native.log

          APK=""
          if [ "${BUILD_TYPE}" = "debug" ]; then
            APK=$(find . -type f -name '*.apk' \( -path '*/debug/*' -o -iname '*debug*.apk' \) 2>/dev/null | head -1 || true)
          fi
          if [ -z "$APK" ]; then
            APK=$(find . -type f -name '*.apk' -path '*/release/*' 2>/dev/null | head -1 || true)
          fi
          if [ -z "$APK" ]; then
            APK=$(find . -type f -name '*.apk' 2>/dev/null | head -1 || true)
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "FATAL: APK tidak ditemukan"
            find . -name '*.apk' 2>/dev/null | head -20 || true
            tail -n 120 /tmp/gradle-native.log || true
            exit 1
          fi
          cp "$(readlink -f "$APK")" "$GITHUB_WORKSPACE/app-release.apk"
          ls -lh "$GITHUB_WORKSPACE/app-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.meta.outputs.job_id }}
          path: app-release.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-log-${{ steps.meta.outputs.job_id }}
          path: /tmp/gradle-native.log
          if-no-files-found: ignore
          retention-days: 3
