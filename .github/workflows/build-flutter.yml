name: Build Flutter APK

on:
  repository_dispatch:
    types: [web2apk-build-flutter]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.27.4'
  ANDROID_API_LEVEL: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  build:
    name: Flutter APK
    runs-on: ubuntu-latest
    
    steps:
      # ==========================================
      # STEP 1: Checkout Repository
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # STEP 2: Setup Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # ==========================================
      # STEP 3: Setup Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================
      # STEP 4: Setup Flutter
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: 'flutter'
          cache-path: ${{ runner.tool_cache }}/flutter

      # ==========================================
      # STEP 5: Download Project ZIP
      # ==========================================
      - name: Download Project ZIP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ github.event.client_payload.jobId }}
          ASSET_ID: ${{ github.event.client_payload.assetId }}
        run: |
          echo "Job ID: $JOB_ID"
          echo "Asset ID: $ASSET_ID"
          
          # Download ZIP from GitHub Release
          DOWNLOAD_URL="https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}"
          
          curl -sL \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o project.zip \
            "$DOWNLOAD_URL"
          
          # Verify download
          if [ ! -f project.zip ] || [ ! -s project.zip ]; then
            echo "❌ Failed to download project ZIP"
            exit 1
          fi
          
          echo "✅ Downloaded project.zip ($(du -h project.zip | cut -f1))"
          
          # Extract ZIP
          unzip -q project.zip -d project_src
          
          # Find pubspec.yaml
          if [ -f project_src/pubspec.yaml ]; then
            echo "✅ Found pubspec.yaml at root"
          else
            FOUND=$(find project_src -name "pubspec.yaml" -type f 2>/dev/null | head -1)
            if [ -z "$FOUND" ]; then
              echo "❌ ERROR: pubspec.yaml not found!"
              echo "Files in project_src:"
              find project_src -maxdepth 3 -type f | head -30
              exit 1
            fi
            echo "✅ Found pubspec.yaml at: $FOUND"
            mv "$(dirname "$FOUND")"/* project_src/
          fi

      # ==========================================
      # STEP 6: FIX pubspec.yaml (ANTI ERROR)
      # ==========================================
      - name: Fix pubspec.yaml
        run: |
          cd project_src
          
          # Backup original
          cp pubspec.yaml pubspec.yaml.bak
          
          # Run Python fixer
          python3 << 'PYEOF'
import re
import pathlib
import sys

p = pathlib.Path("pubspec.yaml")

if not p.exists():
    print("❌ pubspec.yaml not found!")
    sys.exit(1)

t = p.read_text(encoding="utf-8", errors="ignore")
original = t
fixes = []

# 1. Get project name
name_match = re.search(r'^name:\s*(\S+)', t, re.MULTILINE)
if not name_match:
    print("❌ No project name found!")
    sys.exit(1)

project_name = name_match.group(1)
print(f"📦 Project name: {project_name}")

# 2. Remove self-referencing dependency
pattern = rf'^  {re.escape(project_name)}:\s*[^\n]*\n'
t, removed = re.subn(pattern, '', t, flags=re.MULTILINE)
if removed:
    fixes.append(f"Removed self-reference: {project_name}")
    print(f"✅ Removed self-referencing dependency")

# 3. Fix SDK constraint - remove escape characters
t = re.sub(
    r'sdk:\s*\\*["\']>=([0-9.]+)\s*<([0-9.]+)\\*["\']',
    r'sdk: ">=\1 <\2"',
    t
)

# Also fix already broken format like: sdk: \">=3.0.0 <4.0.0\"
t = t.replace('sdk: \\">=3.0.0 <4.0.0\\"', 'sdk: ">=3.0.0 <4.0.0"')
t = t.replace("sdk: \\'>=3.0.0 <4.0.0\\'", "sdk: '>=3.0.0 <4.0.0'")

# 4. Ensure SDK constraint exists
if 'sdk:' not in t:
    print("⚠️ No SDK constraint found, adding...")
    t = re.sub(
        r'(name:\s*\S+\n)',
        r'\1\nenvironment:\n  sdk: ">=3.0.0 <4.0.0"\n',
        t,
        count=1
    )
    fixes.append("Added SDK constraint")

# 5. Clean up formatting
t = re.sub(r' +$', '', t, flags=re.MULTILINE)  # Remove trailing spaces
t = re.sub(r'\n{3,}', '\n\n', t)               # Max 2 consecutive newlines
if not t.endswith('\n'):
    t += '\n'

# Save if changed
if t != original:
    p.write_text(t, encoding="utf-8")
    print(f"\n✅ pubspec.yaml FIXED! ({len(fixes)} fixes)")
    for f in fixes:
        print(f"   • {f}")
else:
    print("\n✅ pubspec.yaml already clean!")

# Verify
print("\n=== VERIFICATION ===")
content = p.read_text(encoding="utf-8")
checks = [
    ("No self-reference", f"{project_name}:" not in content.split("dependencies:")[-1]),
    ("SDK constraint present", "sdk:" in content),
    ("No escape chars", '\\"' not in content),
]
all_ok = True
for name, passed in checks:
    status = "✅" if passed else "❌"
    print(f"{status} {name}")
    if not passed:
        all_ok = False

if not all_ok:
    sys.exit(1)

print("\n=== FINAL pubspec.yaml ===")
print(content)
PYEOF

      # ==========================================
      # STEP 7: Setup local.properties
      # ==========================================
      - name: Setup local.properties
        run: |
          cd project_src
          cat > android/local.properties << EOF
          flutter.sdk=${FLUTTER_ROOT}
          sdk.dir=${ANDROID_SDK_ROOT}
          EOF
          cat android/local.properties

      # ==========================================
      # STEP 8: Clean & Get Dependencies
      # ==========================================
      - name: Clean & Get Dependencies
        run: |
          cd project_src
          rm -f pubspec.lock
          flutter pub get

      # ==========================================
      # STEP 9: Build APK Release
      # ==========================================
      - name: Build APK Release
        run: |
          cd project_src
          
          # Build with error handling
          set +e
          flutter build apk --release 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "❌ Build failed! Last 100 lines of log:"
            tail -100 build.log
            exit 1
          fi
          
          echo "✅ Build successful!"

      # ==========================================
      # STEP 10: Verify & Upload APK
      # ==========================================
      - name: Verify & Upload APK
        run: |
          cd project_src
          
          # Find APK
          APK_PATH=""
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          else
            APK_PATH=$(find build -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          
          echo "✅ APK found: $APK_PATH"
          ls -lh "$APK_PATH"
          
          # Copy to workspace root
          cp "$APK_PATH" "$GITHUB_WORKSPACE/app-release.apk"

      # ==========================================
      # STEP 11: Upload Artifact
      # ==========================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.event.client_payload.jobId || 'manual' }}
          path: app-release.apk
          retention-days: 7
          compression-level: 0

      # ==========================================
      # STEP 12: Upload Fixed Project (for debugging)
      # ==========================================
      - name: Upload Fixed Project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-fixed-${{ github.event.client_payload.jobId || 'manual' }}
          path: |
            project_src/pubspec.yaml
            project_src/pubspec.yaml.bak
          retention-days: 7
