name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Job ID
        required: true
        type: string
      userId:
        description: User ID
        required: true
        type: string
      payload:
        description: JSON payload
        required: true
        type: string
  repository_dispatch:
    types:
      - web2apk-build-flutter
      - web2apk-build

env:
  JAVA_VERSION: "17"
  FLUTTER_VERSION: "3.32.8"
  ANDROID_API_LEVEL: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  build:
    name: Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse payload
        id: meta
        env:
          PAYLOAD_INPUT: ${{ inputs.payload }}
          JOB_ID_INPUT: ${{ inputs.jobId }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os
          event_name = os.environ.get("EVENT_NAME", "")
          event_path = os.environ.get("EVENT_PATH", "")
          p = {}
          if event_name == "repository_dispatch" and event_path and os.path.isfile(event_path):
              ev = json.load(open(event_path, encoding="utf-8"))
              p = ev.get("client_payload") or {}
              print("source=repository_dispatch", list(p.keys()))
          else:
              raw = os.environ.get("PAYLOAD_INPUT") or ""
              if raw:
                  try:
                      p = json.loads(raw)
                  except Exception as e:
                      print("payload json error", e)
                      p = {}
              print("source=workflow_dispatch", list(p.keys()) if isinstance(p, dict) else type(p))

          def g(*keys):
              for k in keys:
                  v = p.get(k) if isinstance(p, dict) else None
                  if v is not None and str(v).strip() != "":
                      return str(v).strip()
              return ""

          asset = g("assetId", "asset_id")
          tag = g("zipReleaseTag", "releaseTag", "release_tag")
          repo = g("repo") or os.environ.get("GITHUB_REPOSITORY", "")
          token = g("downloadToken", "token", "ghToken")
          app = g("appName", "app_name") or "MyApp"
          job_id = g("jobId", "job_id") or os.environ.get("JOB_ID_INPUT", "")
          inbox = g("inboxPath", "inbox_path")
          branch = g("branch") or "main"

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"asset_id={asset}\n")
              f.write(f"release_tag={tag}\n")
              f.write(f"repo={repo}\n")
              f.write(f"app_name={app}\n")
              f.write(f"job_id={job_id}\n")
              f.write(f"inbox_path={inbox}\n")
              f.write(f"branch={branch}\n")
          if token:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write(f"DL_TOKEN={token}\n")
          print("asset_id=", asset)
          print("release_tag=", tag)
          print("repo=", repo)
          print("job_id=", job_id)
          print("has_token=", "yes" if token else "no")
          PY

      - name: Download ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_ID: ${{ steps.meta.outputs.asset_id }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          REPO: ${{ steps.meta.outputs.repo }}
          INBOX: ${{ steps.meta.outputs.inbox_path }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          JOB_ID: ${{ steps.meta.outputs.job_id }}
        run: |
          set -eu
          TOKEN="${DL_TOKEN:-$GH_TOKEN}"
          REPO="${REPO:-$GITHUB_REPOSITORY}"
          BRANCH="${BRANCH:-main}"
          mkdir -p project_src
          if [ -n "${ASSET_ID:-}" ] && [ -n "$TOKEN" ]; then
            echo "Download asset id=$ASSET_ID from $REPO"
            curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/octet-stream" \
              -L "https://api.github.com/repos/$REPO/releases/assets/$ASSET_ID" \
              -o project.zip
          elif [ -n "${RELEASE_TAG:-}" ] && [ -n "$TOKEN" ]; then
            echo "Download release tag=$RELEASE_TAG"
            REL=$(curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/tags/$RELEASE_TAG")
            AID=$(python3 -c "import json,sys; d=json.load(sys.stdin); print(next((a['id'] for a in d.get('assets') or [] if a.get('name')=='project.zip'),''))" <<<"$REL")
            if [ -z "$AID" ]; then echo "project.zip not in release"; exit 1; fi
            curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/octet-stream" \
              -L "https://api.github.com/repos/$REPO/releases/assets/$AID" -o project.zip
          else
            echo "FATAL: no ASSET_ID/RELEASE_TAG or token"
            exit 1
          fi
          ls -lh project.zip
          unzip -o -q project.zip -d project_src
          echo "unzip done"
          find project_src -name pubspec.yaml -type f | head -5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Locate Flutter project
        id: proj
        run: |
          set -e
          if [ -f project_src/pubspec.yaml ]; then
            DIR=project_src
          else
            FOUND=$(find project_src -name pubspec.yaml -type f | head -1 || true)
            if [ -z "$FOUND" ]; then
              echo "pubspec.yaml not found"
              find project_src -maxdepth 4 -type d | head -40
              exit 1
            fi
            DIR=$(dirname "$FOUND")
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "PROJECT_DIR=$DIR"
          ls -la "$DIR" | head -30

      - name: Relax Dart SDK + clean lock
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path("pubspec.yaml")
          if not p.exists():
              print("no pubspec")
              raise SystemExit(0)
          lines = p.read_text(encoding="utf-8", errors="ignore").splitlines(True)
          out = []
          in_env = False
          sdk_done = False
          for line in lines:
              if re.match(r"^environment:\s*$", line):
                  in_env = True
                  sdk_done = False
                  out.append(line)
                  continue
              if in_env and re.match(r"^[a-zA-Z]", line):
                  if not sdk_done:
                      out.append("  sdk: '>=3.0.0 <4.0.0'\n")
                      sdk_done = True
                  in_env = False
                  out.append(line)
                  continue
              if in_env and re.match(r"^\s+sdk\s*:", line):
                  out.append("  sdk: '>=3.0.0 <4.0.0'\n")
                  sdk_done = True
                  continue
              out.append(line)
          if in_env and not sdk_done:
              out.append("  sdk: '>=3.0.0 <4.0.0'\n")
          p.write_text("".join(out), encoding="utf-8")
          print("environment sdk -> >=3.0.0 <4.0.0")
          PY
          grep -A6 "^environment:" pubspec.yaml || true
          rm -f pubspec.lock

      - name: Sanitize pubspec (no auto-add packages)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re
          pub = Path("pubspec.yaml")
          if not pub.exists():
              print("no pubspec")
              raise SystemExit(0)
          text = pub.read_text(encoding="utf-8", errors="ignore")
          name_m = re.search(r"^name:\s*([a-zA-Z0-9_]+)", text, re.M)
          pkg_name = name_m.group(1) if name_m else ""

          # 1) Hapus dependency yang sama dengan name project (self-dep) + xxo25 palsu
          #    TIDAK mengubah import dart / TIDAK menambah package
          BAD = {pkg_name, pkg_name.lower(), "xxo25"} if pkg_name else {"xxo25"}
          lines = text.splitlines(True)
          out = []
          in_block = False
          removed = []
          for line in lines:
              if re.match(r"^(dependencies|dev_dependencies|dependency_overrides):", line):
                  in_block = True
                  out.append(line)
                  continue
              if in_block and re.match(r"^[a-zA-Z]", line):
                  in_block = False
              if in_block:
                  m = re.match(r"^  ([a-zA-Z0-9_]+)\s*:", line)
                  if m and (m.group(1) in BAD or m.group(1).lower() in BAD):
                      removed.append(m.group(1))
                      continue
              out.append(line)
          text = "".join(out)

          # 2) Pindahkan child ilegal di bawah flutter: (record_platform_interface dll) ke luar
          #    Hanya struktural, bukan ganti package name
          lines = text.splitlines(True)
          out = []
          in_flutter = False
          flutter_indent = None
          illegal = []
          allowed_flutter = {"assets", "fonts", "uses-material-design", "generate", "plugin", "module", "config"}
          for i, line in enumerate(lines):
              if re.match(r"^flutter:\s*$", line):
                  in_flutter = True
                  flutter_indent = None
                  out.append(line)
                  continue
              if in_flutter:
                  if re.match(r"^[a-zA-Z]", line) and not line.startswith(" "):
                      in_flutter = False
                      out.append(line)
                      continue
                  m = re.match(r"^(\s+)([a-zA-Z0-9_]+)\s*:", line)
                  if m:
                      key = m.group(2)
                      if key not in allowed_flutter and key not in ("sdk",):
                          # skip illegal top-level under flutter: (e.g. record_platform_interface)
                          illegal.append(key)
                          # skip this line and nested more-indented lines
                          skip_indent = len(m.group(1))
                          # mark by not appending; consume following deeper lines in loop via state
                          # simpler: just skip this one line if it's a known plugin-looking key
                          continue
              out.append(line)
          if illegal:
              print("removed illegal under flutter:", illegal)
          if removed:
              print("removed self/fake deps:", removed)
          pub.write_text("".join(out), encoding="utf-8")
          print("sanitize done, pkg_name=", pkg_name)
          PY
          rm -f pubspec.lock
          echo "=== pubspec name + deps head ==="
          grep -E "^name:|^dependencies:|^  [a-zA-Z0-9_]+:" pubspec.yaml | head -50 || true

      - name: Pub get
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          flutter --version
          flutter pub get
          echo "pub get OK"

      - name: Prepare Android local.properties
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          mkdir -p android
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_SDK_ROOT"
          } > android/local.properties
          cat android/local.properties

      - name: Force minSdk 24
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re
          MIN = 24
          def patch(t):
              t = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", f"minSdk = {MIN}", t)
              t = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", f"minSdkVersion {MIN}", t)
              t = re.sub(r"minSdkVersion\s*=\s*flutter\.minSdkVersion", f"minSdkVersion = {MIN}", t)
              t = re.sub(r"minSdkVersion\s+\d+", f"minSdkVersion {MIN}", t)
              t = re.sub(r"minSdk\s*=\s*\d+", f"minSdk = {MIN}", t)
              return t
          root = Path("android")
          if not root.exists():
              print("no android/")
              raise SystemExit(0)
          for f in list(root.rglob("*.gradle")) + list(root.rglob("*.gradle.kts")):
              if "build/" in str(f):
                  continue
              try:
                  o = f.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              n = patch(o)
              if n != o:
                  f.write_text(n, encoding="utf-8")
                  print("patched", f)
          print("minSdk hardcode", MIN)
          PY

      - name: Build APK release
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          flutter pub get
          flutter precache --android || true
          set +e
          flutter build apk --release > /tmp/flutter_build.log 2>&1
          BUILD_RC=$?
          set -e
          tail -80 /tmp/flutter_build.log || true
          APK=""
          if [ -d build/app/outputs/flutter-apk ]; then
            APK=$(find build/app/outputs/flutter-apk -name "*.apk" -type f 2>/dev/null | head -1 || true)
          fi
          if [ -z "$APK" ]; then
            APK=$(find build -name "*.apk" -type f 2>/dev/null | head -1 || true)
          fi
          if [ -z "$APK" ] || [ "$BUILD_RC" -ne 0 ]; then
            echo "BUILD FAILED rc=$BUILD_RC"
            tail -300 /tmp/flutter_build.log || true
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/app-release.apk"
          ls -lh "$GITHUB_WORKSPACE/app-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.meta.outputs.job_id }}
          path: app-release.apk
          if-no-files-found: error
          retention-days: 3
