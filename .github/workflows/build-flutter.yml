name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Job ID
        required: true
        type: string
      userId:
        description: User ID
        required: true
        type: string
      payload:
        description: JSON payload
        required: true
        type: string
  repository_dispatch:
    types:
      - web2apk-build-flutter
      - web2apk-build

env:
  JAVA_VERSION: "17"
  FLUTTER_VERSION: "3.32.8"
  ANDROID_API_LEVEL: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  build:
    name: Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse payload
        id: meta
        env:
          PAYLOAD_INPUT: ${{ inputs.payload }}
          JOB_ID_INPUT: ${{ inputs.jobId }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os
          event_name = os.environ.get("EVENT_NAME", "")
          event_path = os.environ.get("EVENT_PATH", "")
          p = {}
          if event_name == "repository_dispatch" and event_path and os.path.isfile(event_path):
              ev = json.load(open(event_path, encoding="utf-8"))
              p = ev.get("client_payload") or {}
          else:
              raw = os.environ.get("PAYLOAD_INPUT") or ""
              if raw:
                  try: p = json.loads(raw)
                  except Exception: p = {}
          def g(*keys):
              for k in keys:
                  v = p.get(k) if isinstance(p, dict) else None
                  if v is not None and str(v).strip() != "":
                      return str(v).strip()
              return ""
          asset = g("assetId", "asset_id")
          tag = g("zipReleaseTag", "releaseTag", "release_tag")
          repo = g("repo") or os.environ.get("GITHUB_REPOSITORY", "")
          token = g("downloadToken", "token", "ghToken")
          app = g("appName", "app_name") or "MyApp"
          job_id = g("jobId", "job_id") or os.environ.get("JOB_ID_INPUT", "")
          inbox = g("inboxPath", "inbox_path")
          branch = g("branch") or "main"
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"asset_id={asset}\n")
              f.write(f"release_tag={tag}\n")
              f.write(f"repo={repo}\n")
              f.write(f"app_name={app}\n")
              f.write(f"job_id={job_id}\n")
              f.write(f"inbox_path={inbox}\n")
              f.write(f"branch={branch}\n")
          if token:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write(f"DL_TOKEN={token}\n")
          print("asset_id=", asset, "tag=", tag, "repo=", repo)
          PY

      - name: Download ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_ID: ${{ steps.meta.outputs.asset_id }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          REPO: ${{ steps.meta.outputs.repo }}
          INBOX: ${{ steps.meta.outputs.inbox_path }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          JOB_ID: ${{ steps.meta.outputs.job_id }}
        run: |
          set -eu
          TOKEN="${DL_TOKEN:-$GH_TOKEN}"
          REPO="${REPO:-$GITHUB_REPOSITORY}"
          BRANCH="${BRANCH:-main}"
          INBOX="${INBOX:-.web2apk-inbox/${JOB_ID}/project.zip}"
          echo "[dl] repo=$REPO asset=$ASSET_ID tag=$RELEASE_TAG"
          download_ok=0
          rm -f project.zip
          if [ -n "${ASSET_ID}" ]; then
            code=$(curl -sS -L --retry 8 --retry-delay 2 -o project.zip -w "%{http_code}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/releases/assets/${ASSET_ID}" || echo 000)
            sz=$(stat -c%s project.zip 2>/dev/null || echo 0)
            echo "[dl] asset HTTP=$code size=$sz"
            if [ "$sz" -gt 5000 ]; then download_ok=1; else rm -f project.zip; fi
          fi
          if [ "$download_ok" -eq 0 ] && [ -n "${RELEASE_TAG}" ]; then
            REL=$(curl -sS -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/tags/${RELEASE_TAG}" || true)
            echo "$REL" > /tmp/rel.json
            AID2=$(python3 -c 'import json;d=json.load(open("/tmp/rel.json"));print(next((str(a["id"]) for a in d.get("assets",[]) if a.get("name")=="project.zip"),""))' 2>/dev/null || true)
            if [ -n "$AID2" ]; then
              code=$(curl -sS -L --retry 5 -o project.zip -w "%{http_code}" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Accept: application/octet-stream" \
                "https://api.github.com/repos/${REPO}/releases/assets/${AID2}" || echo 000)
              sz=$(stat -c%s project.zip 2>/dev/null || echo 0)
              if [ "$sz" -gt 5000 ]; then download_ok=1; else rm -f project.zip; fi
            fi
          fi
          if [ "$download_ok" -eq 0 ]; then
            echo "FATAL ZIP download failed"
            exit 1
          fi
          if ! head -c 4 project.zip | grep -q 'PK'; then
            echo "FATAL: not a zip"
            exit 1
          fi
          rm -rf project_src && mkdir -p project_src
          python3 << 'UNZIPPY'
          import zipfile, os, sys
          dest = "project_src"
          ok = skip = 0
          z = zipfile.ZipFile("project.zip", "r")
          for info in z.infolist():
              name = info.filename
              if not name or name.endswith("/"):
                  try: os.makedirs(os.path.join(dest, name), exist_ok=True)
                  except Exception: pass
                  continue
              try:
                  z.extract(info, dest); ok += 1
              except Exception as e:
                  skip += 1
                  print("skip", name, e)
          z.close()
          print(f"extracted={ok} skipped={skip}")
          if ok < 3: sys.exit(1)
          UNZIPPY
          ND=$(find project_src -mindepth 1 -maxdepth 1 -type d | wc -l)
          NF=$(find project_src -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$ND" -eq 1 ] && [ "$NF" -eq 0 ]; then
            sub=$(find project_src -mindepth 1 -maxdepth 1 -type d | head -1)
            shopt -s dotglob
            mv "$sub"/* project_src/ 2>/dev/null || true
            rmdir "$sub" 2>/dev/null || true
            shopt -u dotglob
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK
        run: |
          set -euo pipefail
          ANDROID_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_ROOT/cmdline-tools"
          rm -rf "$ANDROID_ROOT/cmdline-tools/latest"
          mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_ROOT/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_HOME="$ANDROID_ROOT"
          export PATH="$ANDROID_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-${{ env.ANDROID_API_LEVEL }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Locate project
        id: proj
        run: |
          set -e
          if [ -f project_src/pubspec.yaml ]; then
            echo "dir=project_src" >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find project_src -name pubspec.yaml -type f | head -1)
            if [ -z "$FOUND" ]; then echo "pubspec.yaml not found"; exit 1; fi
            echo "dir=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove self / fake local deps only
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re
          pub = Path("pubspec.yaml")
          text = pub.read_text(encoding="utf-8", errors="ignore")
          name_m = re.search(r"^name:\s*([a-zA-Z0-9_]+)", text, re.M)
          pkg = name_m.group(1) if name_m else ""
          # Hanya hapus nama package sendiri + alias lokal yang tidak ada di pub.dev
          BAD = {x for x in [pkg, (pkg or "").lower(), "xxo25", "otax"] if x}
          lines = text.splitlines(True)
          out, in_block, removed = [], False, []
          for line in lines:
              if re.match(r"^(dependencies|dev_dependencies|dependency_overrides)\s*:", line):
                  in_block = True
                  out.append(line)
                  continue
              if in_block and re.match(r"^[a-zA-Z_]", line):
                  in_block = False
              if in_block:
                  m = re.match(r"^  ([a-zA-Z0-9_]+)\s*:", line)
                  if m and m.group(1).lower() in {b.lower() for b in BAD}:
                      removed.append(m.group(1))
                      continue
              out.append(line)
          text = "".join(out)
          for b in list(BAD):
              text, n = re.subn(rf"^[ \t]*{re.escape(b)}\s*:.*\n?", "", text, flags=re.M|re.I)
              if n:
                  removed.append(f"{b}*{n}")
          # SDK longgar biar cocok banyak base
          lines = text.splitlines(True)
          out, in_env, sdk_done = [], False, False
          for line in lines:
              if re.match(r"^environment\s*:", line):
                  in_env, sdk_done = True, False
                  out.append(line)
                  continue
              if in_env:
                  if re.match(r"^[a-zA-Z_]", line):
                      if not sdk_done:
                          out.append("  sdk: '>=3.0.0 <4.0.0'\n")
                          sdk_done = True
                      in_env = False
                      out.append(line)
                      continue
                  if re.match(r"^\s+sdk\s*:", line):
                      out.append("  sdk: '>=3.0.0 <4.0.0'\n")
                      sdk_done = True
                      continue
                  out.append(line)
                  continue
              out.append(line)
          if in_env and not sdk_done:
              out.append("  sdk: '>=3.0.0 <4.0.0'\n")
          text = "".join(out)
          pub.write_text(text, encoding="utf-8")
          print("removed_local_deps=", removed)
          # rewrite import package:xxo25 -> package:<name>
          if pkg:
              for dart in Path(".").rglob("*.dart"):
                  s = str(dart).replace("\\", "/")
                  if any(x in s for x in [".dart_tool", "/build/", ".pub-cache"]):
                      continue
                  try:
                      t = dart.read_text(encoding="utf-8", errors="ignore")
                  except Exception:
                      continue
                  n = t
                  for b in BAD:
                      if b.lower() != pkg.lower():
                          n = n.replace(f"package:{b}/", f"package:{pkg}/")
                  if n != t:
                      dart.write_text(n, encoding="utf-8")
          if re.search(r"^\s*xxo25\s*:", text, re.M|re.I):
              raise SystemExit("xxo25 still in pubspec")
          print("strip_ok")
          PY
          grep -niE '^\s*xxo25\s*:' pubspec.yaml && exit 1 || true
          rm -f pubspec.lock

      - name: flutter pub get
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          flutter --version
          flutter pub get

      - name: Gradle 8.13 + local.properties + minSdk
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          mkdir -p android/gradle/wrapper
          WP="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WP" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip|' "$WP"
          else
            printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-all.zip\n' > "$WP"
          fi
          cat "$WP" || true
          {
            echo "flutter.sdk=${FLUTTER_ROOT}"
            echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          } > android/local.properties
          python3 <<'PY'
          from pathlib import Path
          import re
          MIN = 24
          def patch(t):
              t = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", f"minSdk = {MIN}", t)
              t = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", f"minSdkVersion {MIN}", t)
              t = re.sub(r"minSdkVersion\s*=\s*flutter\.minSdkVersion", f"minSdkVersion = {MIN}", t)
              t = re.sub(r"minSdkVersion\s+\d+", f"minSdkVersion {MIN}", t)
              t = re.sub(r"minSdk\s*=\s*\d+", f"minSdk = {MIN}", t)
              return t
          for f in list(Path("android").rglob("*.gradle")) + list(Path("android").rglob("*.gradle.kts")):
              if "build/" in str(f):
                  continue
              try:
                  o = f.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              n = patch(o)
              if n != o:
                  f.write_text(n, encoding="utf-8")
                  print("patched", f)
          PY


      - name: Stub record_linux (Android CI only)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re
          root = Path("third_party/record_linux_stub")
          (root / "lib").mkdir(parents=True, exist_ok=True)
          (root / "pubspec.yaml").write_text(
              "name: record_linux\n"
              "description: Stub for Android CI\n"
              "version: 1.0.0\n"
              "publish_to: none\n"
              "environment:\n"
              "  sdk: '>=3.0.0 <4.0.0'\n"
              "dependencies:\n"
              "  flutter:\n"
              "    sdk: flutter\n"
              "  record_platform_interface: any\n",
              encoding="utf-8",
          )
          (root / "lib" / "record_linux.dart").write_text(
              "import 'dart:async';\n"
              "import 'package:record_platform_interface/record_platform_interface.dart';\n"
              "\n"
              "class RecordLinux extends RecordPlatform {\n"
              "  static void registerWith() {\n"
              "    RecordPlatform.instance = RecordLinux();\n"
              "  }\n"
              "\n"
              "  @override\n"
              "  dynamic noSuchMethod(Invocation invocation) {\n"
              "    final name = invocation.memberName.toString();\n"
              "    if (name.contains('isSupported') ||\n"
              "        name.contains('hasPermission') ||\n"
              "        name.contains('isRecording') ||\n"
              "        name.contains('isPaused')) {\n"
              "      return Future<bool>.value(false);\n"
              "    }\n"
              "    if (name.contains('listInputDevices')) {\n"
              "      return Future.value(<dynamic>[]);\n"
              "    }\n"
              "    if (name.contains('onStateChanged') ||\n"
              "        name.contains('onAmplitudeChanged')) {\n"
              "      return const Stream.empty();\n"
              "    }\n"
              "    if (name.contains('stop')) {\n"
              "      return Future<String?>.value(null);\n"
              "    }\n"
              "    return Future<void>.value();\n"
              "  }\n"
              "}\n",
              encoding="utf-8",
          )
          pub = Path("pubspec.yaml")
          txt = pub.read_text(encoding="utf-8", errors="ignore")
          # remove existing dependency_overrides block once
          txt = re.sub(
              r"\n*dependency_overrides:\s*\n(?:[ \t]+[^\n]*\n)*",
              "\n",
              txt,
              count=1,
          )
          # only override record_linux path — no other auto pins
          block = (
              "\ndependency_overrides:\n"
              "  record_linux:\n"
              "    path: third_party/record_linux_stub\n"
          )
          pub.write_text(txt.rstrip() + "\n" + block + "\n", encoding="utf-8")
          print("record_linux stub ready")
          PY
          rm -f pubspec.lock
          flutter pub get

      - name: Build APK release
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          flutter pub get
          flutter precache --android || true
          set +e
          flutter build apk --release > /tmp/flutter_build.log 2>&1
          BUILD_RC=$?
          set -e
          tail -100 /tmp/flutter_build.log || true
          APK=$(find build -name "*.apk" -type f 2>/dev/null | head -1 || true)
          if [ -z "$APK" ] || [ "$BUILD_RC" -ne 0 ]; then
            echo "BUILD FAILED rc=$BUILD_RC"
            tail -250 /tmp/flutter_build.log || true
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/app-release.apk"
          ls -lh "$GITHUB_WORKSPACE/app-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.meta.outputs.job_id }}
          path: app-release.apk
          if-no-files-found: error
          retention-days: 3
