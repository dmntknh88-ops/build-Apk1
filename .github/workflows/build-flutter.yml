name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Job ID
        required: true
        type: string
      userId:
        description: User ID
        required: true
        type: string
      payload:
        description: JSON payload
        required: true
        type: string
  repository_dispatch:
    types:
      - web2apk-build-flutter
      - web2apk-build

env:
  JAVA_VERSION: "17"
  FLUTTER_VERSION: "3.32.8"
  ANDROID_API_LEVEL: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  build:
    name: Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse payload
        id: meta
        env:
          PAYLOAD_INPUT: ${{ inputs.payload }}
          JOB_ID_INPUT: ${{ inputs.jobId }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os
          event_name = os.environ.get("EVENT_NAME", "")
          event_path = os.environ.get("EVENT_PATH", "")
          p = {}
          if event_name == "repository_dispatch" and event_path and os.path.isfile(event_path):
              ev = json.load(open(event_path, encoding="utf-8"))
              p = ev.get("client_payload") or {}
          else:
              raw = os.environ.get("PAYLOAD_INPUT") or ""
              if raw:
                  try:
                      p = json.loads(raw)
                  except Exception:
                      p = {}
          def g(*keys):
              for k in keys:
                  v = p.get(k) if isinstance(p, dict) else None
                  if v is not None and str(v).strip() != "":
                      return str(v).strip()
              return ""
          asset = g("assetId", "asset_id")
          tag = g("zipReleaseTag", "releaseTag", "release_tag")
          repo = g("repo") or os.environ.get("GITHUB_REPOSITORY", "")
          token = g("downloadToken", "token", "ghToken")
          job_id = g("jobId", "job_id") or os.environ.get("JOB_ID_INPUT", "")
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"asset_id={asset}\n")
              f.write(f"release_tag={tag}\n")
              f.write(f"repo={repo}\n")
              f.write(f"job_id={job_id}\n")
          if token:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write(f"DL_TOKEN={token}\n")
          print("asset_id=", asset, "tag=", tag, "repo=", repo, "job=", job_id)
          PY

      - name: Download ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_ID: ${{ steps.meta.outputs.asset_id }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          set -eu
          TOKEN="${DL_TOKEN:-$GH_TOKEN}"
          REPO="${REPO:-$GITHUB_REPOSITORY}"
          mkdir -p project_src
          if [ -n "${ASSET_ID:-}" ] && [ -n "$TOKEN" ]; then
            curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/octet-stream" \
              -L "https://api.github.com/repos/$REPO/releases/assets/$ASSET_ID" -o project.zip
          elif [ -n "${RELEASE_TAG:-}" ] && [ -n "$TOKEN" ]; then
            REL=$(curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/tags/$RELEASE_TAG")
            AID=$(python3 -c "import json,sys; d=json.load(sys.stdin); print(next((a['id'] for a in d.get('assets') or [] if a.get('name')=='project.zip'),''))" <<<"$REL")
            [ -n "$AID" ] || { echo "no project.zip in release"; exit 1; }
            curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/octet-stream" \
              -L "https://api.github.com/repos/$REPO/releases/assets/$AID" -o project.zip
          else
            echo "FATAL missing asset/token"; exit 1
          fi
          ls -lh project.zip
          unzip -o -q project.zip -d project_src
          find project_src -name pubspec.yaml | head -5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            platforms;android-33
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Locate project
        id: proj
        run: |
          set -e
          if [ -f project_src/pubspec.yaml ]; then DIR=project_src
          else
            FOUND=$(find project_src -name pubspec.yaml -type f | head -1 || true)
            [ -n "$FOUND" ] || { echo "no pubspec"; exit 1; }
            DIR=$(dirname "$FOUND")
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "PROJECT=$DIR"

      - name: Fix pubspec (sdk + strip fake deps + record override)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path("pubspec.yaml")
          text = p.read_text(encoding="utf-8", errors="ignore")

          # SDK relax
          lines = text.splitlines(True)
          out, in_env, sdk_done = [], False, False
          for line in lines:
              if re.match(r"^environment:\s*$", line):
                  in_env, sdk_done = True, False
                  out.append(line); continue
              if in_env and re.match(r"^[a-zA-Z]", line):
                  if not sdk_done: out.append("  sdk: '>=3.0.0 <4.0.0'\n")
                  in_env = False; out.append(line); continue
              if in_env and re.match(r"^\s+sdk\s*:", line):
                  out.append("  sdk: '>=3.0.0 <4.0.0'\n"); sdk_done = True; continue
              out.append(line)
          if in_env and not sdk_done:
              out.append("  sdk: '>=3.0.0 <4.0.0'\n")
          text = "".join(out)

          name_m = re.search(r"^name:\s*([a-zA-Z0-9_]+)", text, re.M)
          pkg = name_m.group(1) if name_m else ""
          BAD = {pkg, pkg.lower(), "xxo25", "otax"} if pkg else {"xxo25"}

          # Strip self/fake deps only — TIDAK auto-add package
          lines = text.splitlines(True)
          out, in_block, removed = [], False, []
          for line in lines:
              if re.match(r"^(dependencies|dev_dependencies|dependency_overrides):", line):
                  in_block = True; out.append(line); continue
              if in_block and re.match(r"^[a-zA-Z]", line):
                  in_block = False
              if in_block:
                  m = re.match(r"^  ([a-zA-Z0-9_]+)\s*:", line)
                  if m and m.group(1) in BAD:
                      removed.append(m.group(1)); continue
              out.append(line)
          text = "".join(out)

          # Force dependency_overrides record (hindari record_linux 0.7 hasPermission)
          text = re.sub(r"\ndependency_overrides:[\s\S]*?(?=\n[a-zA-Z_]|\Z)", "\n", text, count=1)
          text = text.rstrip() + """

dependency_overrides:
  record_linux: 1.1.1
  record_platform_interface: 1.3.0
"""
          p.write_text(text, encoding="utf-8")
          print("FIX_PUBSPEC pkg=", pkg, "removed=", removed)
          print("NO_AUTO_ADD packages")
          PY
          rm -f pubspec.lock
          grep -A15 "^dependency_overrides:" pubspec.yaml || true

      - name: Pub get
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          flutter --version
          flutter pub get
          flutter pub deps 2>/dev/null | grep -i record || true
          echo "pub get OK"

      - name: Prepare Android
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          mkdir -p android
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_SDK_ROOT"
          } > android/local.properties
          python3 <<'PY'
          from pathlib import Path
          import re
          MIN, NDK = 24, "27.0.12077973"
          def patch(t):
              t = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", f"minSdk = {MIN}", t)
              t = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", f"minSdkVersion {MIN}", t)
              t = re.sub(r"minSdkVersion\s*=\s*flutter\.minSdkVersion", f"minSdkVersion = {MIN}", t)
              t = re.sub(r"minSdkVersion\s+\d+", f"minSdkVersion {MIN}", t)
              t = re.sub(r"minSdk\s*=\s*\d+", f"minSdk = {MIN}", t)
              t = re.sub(r"ndkVersion\s*=\s*flutter\.ndkVersion", f'ndkVersion = "{NDK}"', t)
              t = re.sub(r'ndkVersion\s*=\s*["\'][^"\']+["\']', f'ndkVersion = "{NDK}"', t)
              t = re.sub(r'ndkVersion\s+["\'][^"\']+["\']', f'ndkVersion "{NDK}"', t)
              t = re.sub(r"ndkVersion\s+[0-9][0-9.]+", f'ndkVersion "{NDK}"', t)
              if "ndkVersion" not in t and re.search(r"android\s*\{", t):
                  t = re.sub(r"(android\s*\{)", rf'\1\n    ndkVersion = "{NDK}"', t, count=1)
              return t
          root = Path("android")
          if not root.exists():
              raise SystemExit(0)
          for f in list(root.rglob("*.gradle")) + list(root.rglob("*.gradle.kts")):
              if "build/" in str(f): continue
              try: o = f.read_text(encoding="utf-8", errors="ignore")
              except Exception: continue
              n = patch(o)
              if n != o:
                  f.write_text(n, encoding="utf-8")
                  print("patched", f)
          print("android prepare OK")
          PY

      - name: Build APK release
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          flutter pub get
          flutter precache --android || true
          set +e
          flutter build apk --release > /tmp/flutter_build.log 2>&1
          RC=$?
          set -e
          tail -80 /tmp/flutter_build.log || true
          APK=$(find build/app/outputs/flutter-apk -name "*.apk" -type f 2>/dev/null | head -1 || true)
          [ -n "$APK" ] || APK=$(find build -name "*.apk" -type f 2>/dev/null | head -1 || true)
          if [ -z "$APK" ] || [ "$RC" -ne 0 ]; then
            echo "BUILD FAILED rc=$RC"
            tail -250 /tmp/flutter_build.log || true
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/app-release.apk"
          ls -lh "$GITHUB_WORKSPACE/app-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.meta.outputs.job_id }}
          path: app-release.apk
          if-no-files-found: error
          retention-days: 3
