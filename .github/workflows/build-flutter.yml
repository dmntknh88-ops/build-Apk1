name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Job ID
        required: true
        type: string
      userId:
        description: User ID
        required: true
        type: string
      payload:
        description: JSON payload
        required: true
        type: string
  repository_dispatch:
    types:
      - web2apk-build-flutter
      - web2apk-build

env:
  JAVA_VERSION: "17"
  FLUTTER_VERSION: "stable"
  ANDROID_API_LEVEL: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  build:
    name: Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse payload
        id: meta
        env:
          PAYLOAD_INPUT: ${{ inputs.payload }}
          JOB_ID_INPUT: ${{ inputs.jobId }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os
          event_name = os.environ.get("EVENT_NAME", "")
          event_path = os.environ.get("EVENT_PATH", "")
          p = {}
          if event_name == "repository_dispatch" and event_path and os.path.isfile(event_path):
              ev = json.load(open(event_path, encoding="utf-8"))
              p = ev.get("client_payload") or {}
              print("source=repository_dispatch", list(p.keys()))
          else:
              raw = os.environ.get("PAYLOAD_INPUT") or ""
              if raw:
                  try:
                      p = json.loads(raw)
                  except Exception as e:
                      print("payload json error", e)
                      p = {}
              print("source=workflow_dispatch", list(p.keys()) if isinstance(p, dict) else type(p))

          def g(*keys):
              for k in keys:
                  v = p.get(k) if isinstance(p, dict) else None
                  if v is not None and str(v).strip() != "":
                      return str(v).strip()
              return ""

          asset = g("assetId", "asset_id")
          tag = g("zipReleaseTag", "releaseTag", "release_tag")
          repo = g("repo") or os.environ.get("GITHUB_REPOSITORY", "")
          token = g("downloadToken", "token", "ghToken")
          app = g("appName", "app_name") or "MyApp"
          job_id = g("jobId", "job_id") or os.environ.get("JOB_ID_INPUT", "")

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"asset_id={asset}\n")
              f.write(f"release_tag={tag}\n")
              f.write(f"repo={repo}\n")
              f.write(f"app_name={app}\n")
              f.write(f"job_id={job_id}\n")
          if token:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write(f"DL_TOKEN={token}\n")
          print("asset_id=", asset)
          print("release_tag=", tag)
          print("repo=", repo)
          print("job_id=", job_id)
          print("has_token=", "yes" if token else "no")
          PY

      - name: Download project ZIP from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_ID: ${{ steps.meta.outputs.asset_id }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          REPO_NAME: ${{ steps.meta.outputs.repo }}
        run: |
          set -eu
          mkdir -p project_src
          REPO="${REPO_NAME:-$GITHUB_REPOSITORY}"
          TAG="${RELEASE_TAG:-}"
          AID="${ASSET_ID:-}"
          TOKEN="${DL_TOKEN:-$GH_TOKEN}"
          if [ -z "$TOKEN" ]; then TOKEN="$GH_TOKEN"; fi
          echo "REPO=$REPO TAG=$TAG ASSET_ID=$AID token_len=${#TOKEN}"

          download_asset() {
            local id="$1"
            local out="$2"
            local code
            code=$(curl -sS -L --retry 5 --retry-delay 2 --connect-timeout 30 \
              -o "$out" -w "%{http_code}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/releases/assets/${id}" || echo "000")
            local sz
            sz=$(stat -c%s "$out" 2>/dev/null || echo 0)
            echo "download_asset id=$id HTTP=$code size=$sz"
            if head -c 40 "$out" 2>/dev/null | grep -qiE '<!doctype|<html|\{"message"'; then
              head -c 300 "$out" || true
              return 1
            fi
            [ "$sz" -gt 10000 ]
          }

          OK=0
          if [ -n "$AID" ]; then
            if download_asset "$AID" project.zip; then OK=1; fi
          fi

          if [ "$OK" -eq 0 ] && [ -n "$TAG" ]; then
            REL=$(curl -sS \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" || true)
            AID2=$(printf '%s' "$REL" | python3 -c '
          import json,sys
          try:
            d=json.load(sys.stdin)
            print(next((str(a["id"]) for a in d.get("assets",[]) if a.get("name")=="project.zip"),""))
          except Exception:
            print("")
          ')
            echo "AID2=$AID2"
            if [ -n "$AID2" ]; then
              if download_asset "$AID2" project.zip; then OK=1; fi
            fi
          fi

          if [ "$OK" -eq 0 ] && [ -n "$TAG" ]; then
            if command -v gh >/dev/null 2>&1; then
              GH_TOKEN="$TOKEN" gh release download "$TAG" -R "$REPO" -p "project.zip" -D . || true
              if [ -f project.zip ]; then
                SZ=$(stat -c%s project.zip)
                if [ "$SZ" -gt 10000 ]; then OK=1; else rm -f project.zip; fi
              fi
            fi
          fi

          if [ "$OK" -eq 0 ]; then
            echo "FATAL ZIP download failed REPO=$REPO TAG=$TAG AID=$AID"
            exit 1
          fi

          echo "ZIP OK size=$(stat -c%s project.zip)"
          unzip -q project.zip -d project_src
          ND=$(find project_src -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l || echo 0)
          NF=$(find project_src -mindepth 1 -maxdepth 1 -type f 2>/dev/null | wc -l || echo 0)
          if [ "$ND" -eq 1 ] && [ "$NF" -eq 0 ]; then
            ROOT=$(find project_src -mindepth 1 -maxdepth 1 -type d | head -1)
            mv "$ROOT"/* project_src/ 2>/dev/null || true
            mv "$ROOT"/.[!.]* project_src/ 2>/dev/null || true
            rmdir "$ROOT" 2>/dev/null || true
          fi
          find project_src -maxdepth 3 -type f 2>/dev/null | head -40 || true
          echo "project files listed OK"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK
        run: |
          set -euo pipefail
          ANDROID_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_ROOT/cmdline-tools"
          rm -rf "$ANDROID_ROOT/cmdline-tools/latest"
          mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_ROOT/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_HOME="$ANDROID_ROOT"
          export PATH="$ANDROID_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-${{ env.ANDROID_API_LEVEL }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      - name: Locate Flutter project
        id: proj
        run: |
          set -e
          if [ -f project_src/pubspec.yaml ]; then
            echo "dir=project_src" >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find project_src -name pubspec.yaml -type f | head -1)
            if [ -z "$FOUND" ]; then
              echo "pubspec.yaml not found"
              find project_src -maxdepth 4 -type f | head -80
              exit 1
            fi
            echo "dir=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"
          fi

      - name: Pub get
        working-directory: ${{ steps.proj.outputs.dir }}
        continue-on-error: true
        run: |
          set +e
          rm -f pubspec.lock
          flutter pub get || true





          # Collect declared deps under dependencies: and dev_dependencies:
          declared = set()
          section = None
          for line in pub.splitlines():
              if re.match(r"^dependencies\s*:", line):
                  section = "dep"; continue
              if re.match(r"^dev_dependencies\s*:", line):
                  section = "dev"; continue
              if re.match(r"^[a-zA-Z_]", line) and not line.startswith(" "):
                  section = None; continue
              if section in ("dep", "dev"):
                  m = re.match(r"^\s{2}([a-zA-Z0-9_]+)\s*:", line)
                  if m:
                      declared.add(m.group(1))
          declared |= {"flutter", "flutter_test", "flutter_lints", "cupertino_icons", "meta", "collection", "path", "async", "vector_math", "characters", "material_color_utilities", "sky_engine"}

          # Scan package imports from dart sources
          pkgs = set()
          for f in root.rglob("*.dart"):
              s = str(f)
              if "/.dart_tool/" in s or "/build/" in s:
                  continue
              try:
                  txt = f.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              for m in re.finditer(r"package:([a-zA-Z0-9_]+)/", txt):
                  pkgs.add(m.group(1))

          name_m = re.search(r"^name:\s*([\w]+)", pub, re.M)
          self_name = name_m.group(1) if name_m else ""
          # Jangan add package name sendiri (import package:otax/...)
          missing = sorted(p for p in pkgs if p not in declared and p != self_name)
          # Hapus self-dep jika sempat tertulis
          if self_name:
              pub = re.sub(rf"^\s*{re.escape(self_name)}:\s*.*$", "", pub, flags=re.M)
              pub_path.write_text(pub, encoding="utf-8")
          # Relax environment sdk constraint to match installed Dart
          pub = re.sub(
              r"(environment:\s*\n\s*sdk:\s*)[^\n]+",
              r"\1'>=3.0.0 <4.0.0'",
              pub,
              count=1,
          )
          if "environment:" in pub and "sdk:" not in pub.split("environment:")[1].split("\n\n")[0]:
              pass
          pub_path.write_text(pub, encoding="utf-8")
          print("sdk constraint relaxed to >=3.0.0 <4.0.0")
          print("=== PUBSPEC FIXER ===")
          print("imported:", sorted(pkgs))
          print("missing:", missing)

          # Append missing into dependencies: block if not present
          if missing:
              lines = pub.splitlines(keepends=True)
              out = []
              in_dep = False
              dep_indent_done = False
              inserted = False
              for line in lines:
                  if re.match(r"^dependencies\s*:", line):
                      in_dep = True
                      out.append(line)
                      continue
                  if in_dep and re.match(r"^[a-zA-Z_]", line) and not line.startswith(" "):
                      # end of dependencies — insert missing before leaving
                      if not inserted:
                          for pkg in missing:
                              out.append(f"  {pkg}: any\n")
                          inserted = True
                      in_dep = False
                      out.append(line)
                      continue
                  out.append(line)
              if in_dep and not inserted:
                  for pkg in missing:
                      out.append(f"  {pkg}: any\n")
                  inserted = True
              pub_path.write_text("".join(out), encoding="utf-8")
              print("pubspec.yaml updated with:", missing)
              # strip accidental self dependency
              pub2 = pub_path.read_text(encoding="utf-8", errors="ignore")
              if self_name:
                  pub2 = re.sub(rf"^\s*{re.escape(self_name)}:\s*.*$\n?", "", pub2, flags=re.M)
                  pub_path.write_text(pub2, encoding="utf-8")
              print("strip self after add")

          # Clean lock and resolve
          lock = root / "pubspec.lock"
          if lock.exists():
              lock.unlink()
          r = subprocess.run(["flutter", "pub", "get"], capture_output=True, text=True)
          print(r.stdout[-1500:] if r.stdout else "")
          if r.returncode != 0:
              print(r.stderr[-1500:] if r.stderr else "")
              # retry one by one with flutter pub add
              for pkg in missing:
                  print("retry pub add", pkg)
                  subprocess.run(["flutter", "pub", "add", pkg], capture_output=True, text=True)
              r2 = subprocess.run(["flutter", "pub", "get"], capture_output=True, text=True)
              print(r2.stdout[-800:] if r2.stdout else "")
              if r2.returncode != 0:
                  print(r2.stderr[-800:] if r2.stderr else "")
          print("=== FIXER DONE ===")
          PY



      - name: Upgrade Gradle wrapper (Flutter 3.47+ needs >=8.14)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -eu
          WP="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WP" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.2-all.zip|' "$WP"
            echo "Gradle wrapper -> 8.14.2"
            cat "$WP"
          else
            echo "No gradle-wrapper.properties"
            find android -name "gradle-wrapper.properties" 2>/dev/null || true
          fi
          # gradle.properties: avoid AGP9 newDsl hard-fail on older projects
          GP="android/gradle.properties"
          mkdir -p android
          touch "$GP"
          grep -q 'android.defaults.buildfeatures.buildconfig' "$GP" || echo 'android.defaults.buildfeatures.buildconfig=true' >> "$GP"
          grep -q 'android.nonTransitiveRClass' "$GP" || echo 'android.nonTransitiveRClass=false' >> "$GP"
          # opt out newDsl if property exists in newer AGP
          grep -q 'android.newDsl' "$GP" || echo 'android.newDsl=false' >> "$GP" || true

      - name: Prepare Android local.properties
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -eu
          mkdir -p android
          {
            echo "flutter.sdk=${FLUTTER_ROOT}"
            echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          } > android/local.properties
          cat android/local.properties

      - name: Build APK release
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -eu
          # Pastikan plugin Android ter-generate
          flutter pub get
          flutter precache --android || true

          # Build (log ke file tanpa pipefail)
          set +e
          flutter build apk --release --android-skip-build-dependency-validation > /tmp/flutter_build.log 2>&1
          BUILD_RC=$?
          set -e
          tail -80 /tmp/flutter_build.log || true

          APK=""
          if [ -d build/app/outputs/flutter-apk ]; then
            APK=$(find build/app/outputs/flutter-apk -name "*.apk" -type f 2>/dev/null | head -1 || true)
          fi
          if [ -z "$APK" ]; then
            APK=$(find build -name "*.apk" -type f 2>/dev/null | head -1 || true)
          fi
          if [ -z "$APK" ] || [ "$BUILD_RC" -ne 0 ]; then
            echo "BUILD FAILED rc=$BUILD_RC"
            tail -200 /tmp/flutter_build.log || true
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/app-release.apk"
          ls -lh "$GITHUB_WORKSPACE/app-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.meta.outputs.job_id }}
          path: app-release.apk
          if-no-files-found: error
          retention-days: 3

